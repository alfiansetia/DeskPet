<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges">
  <!-- DeskPet Orange Cat Vector Source -->
  <defs>
    <style>
      .outline { fill: #3D2A1A; }
      .body-shadow { fill: #C87830; }
      .body-main { fill: #FDE68A; }
      .body-light { fill: #FFF5CC; }
      .belly { fill: #FFFBE6; }
      .ear-inner { fill: #F4A5B9; }
      .blush { fill: #EB7D96; fill-opacity: 0.7; }
      .eye-dark { fill: #22223A; }
      .eye-shine { fill: #FFFFFF; }
      .nose { fill: #E682A0; }
      .collar { fill: #4A90D9; }
      .bell { fill: #E9A23B; }
      .bell-dark { fill: #B97319; }
      .stripe { fill: #E8A040; }
    </style>
  </defs>

  <g id="tail">
    <rect x="88" y="96" width="8" height="8" class="body-main" />
    <rect x="92" y="92" width="8" height="8" class="body-main" />
    <rect x="96" y="88" width="8" height="8" class="body-main" />
    <rect x="100" y="80" width="8" height="8" class="body-main" />
    <rect x="104" y="72" width="8" height="8" class="body-main" />
    <rect x="100" y="64" width="8" height="8" class="body-main" />
    <rect x="96" y="64" width="8" height="8" class="body-light" />
  </g>

  <g id="body">
    <!-- Body Shadow & Outline -->
    <rect x="36" y="76" width="56" height="36" class="body-shadow" />
    <rect x="32" y="80" width="64" height="28" class="body-shadow" />
    <!-- Body Main -->
    <rect x="36" y="72" width="56" height="36" class="body-main" />
    <rect x="32" y="76" width="64" height="28" class="body-main" />
    <!-- Belly highlight -->
    <rect x="48" y="76" width="32" height="32" class="belly" />
  </g>

  <g id="stripes">
    <!-- Tabby stripes on forehead -->
    <rect x="28" y="24" width="4" height="8" class="stripe" />
    <rect x="36" y="20" width="4" height="8" class="stripe" />
    <rect x="44" y="24" width="4" height="8" class="stripe" />
    <rect x="80" y="24" width="4" height="8" class="stripe" />
    <rect x="88" y="20" width="4" height="8" class="stripe" />
    <rect x="96" y="24" width="4" height="8" class="stripe" />
    <!-- Body stripes -->
    <rect x="40" y="80" width="4" height="16" class="stripe" />
    <rect x="52" y="76" width="4" height="8" class="stripe" />
    <rect x="72" y="76" width="4" height="8" class="stripe" />
    <rect x="84" y="80" width="4" height="16" class="stripe" />
  </g>

  <g id="paws">
    <rect x="40" y="108" width="16" height="8" class="body-light" />
    <rect x="44" y="112" width="4" height="4" class="outline" />
    <rect x="72" y="108" width="16" height="8" class="body-light" />
    <rect x="76" y="112" width="4" height="4" class="outline" />
  </g>

  <g id="collar">
    <rect x="44" y="72" width="40" height="8" class="collar" />
    <rect x="56" y="76" width="16" height="12" class="bell" />
    <rect x="60" y="80" width="4" height="4" class="bell-dark" />
  </g>

  <g id="ears">
    <!-- Left Ear -->
    <rect x="24" y="16" width="24" height="24" class="body-main" />
    <rect x="28" y="12" width="16" height="8" class="body-main" />
    <rect x="32" y="8" width="8" height="8" class="body-main" />
    <rect x="32" y="16" width="12" height="12" class="ear-inner" />

    <!-- Right Ear -->
    <rect x="80" y="16" width="24" height="24" class="body-main" />
    <rect x="84" y="12" width="16" height="8" class="body-main" />
    <rect x="88" y="8" width="8" height="8" class="body-main" />
    <rect x="84" y="16" width="12" height="12" class="ear-inner" />
  </g>

  <g id="head">
    <!-- Head Outline -->
    <rect x="24" y="28" width="80" height="48" class="outline" />
    <rect x="28" y="24" width="72" height="56" class="outline" />
    <!-- Head Fill -->
    <rect x="28" y="28" width="72" height="48" class="body-main" />
    <rect x="32" y="24" width="64" height="56" class="body-main" />
    <rect x="24" y="36" width="80" height="32" class="body-main" />
    <!-- Top Highlight -->
    <rect x="36" y="28" width="56" height="8" class="body-light" />
    <rect x="40" y="24" width="48" height="8" class="body-light" />
  </g>

  <g id="face">
    <!-- Cheeks Blush -->
    <rect x="28" y="52" width="12" height="8" class="blush" />
    <rect x="88" y="52" width="12" height="8" class="blush" />

    <!-- Left Eye -->
    <rect x="40" y="40" width="12" height="16" class="eye-dark" />
    <rect x="40" y="40" width="4" height="4" class="eye-shine" />
    <rect x="44" y="44" width="4" height="4" class="eye-shine" />

    <!-- Right Eye -->
    <rect x="76" y="40" width="12" height="16" class="eye-dark" />
    <rect x="76" y="40" width="4" height="4" class="eye-shine" />
    <rect x="80" y="44" width="4" height="4" class="eye-shine" />

    <!-- Nose -->
    <rect x="60" y="56" width="8" height="4" class="nose" />

    <!-- Mouth -->
    <rect x="56" y="64" width="4" height="4" class="eye-dark" />
    <rect x="60" y="68" width="8" height="4" class="eye-dark" />
    <rect x="68" y="64" width="4" height="4" class="eye-dark" />
  </g>
</svg>
